{% extends "base.html" %}
{% block title %}Django administration{% endblock %}
{% block content %}
<div style="max-width:420px;margin:6rem auto;padding:2rem;">
    <h1 style="font-size:1.4rem;margin-bottom:1rem;">Django administration</h1>
    {% if form.non_field_errors %}
        <p style="color:#b91c1c;font-weight:600;">{{ form.non_field_errors.0 }}</p>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        <p><label>Username: <input type="text" name="username" class="form-control" autocomplete="username"></label></p>
        <p><label>Password: <input type="password" name="password" class="form-control" autocomplete="current-password"></label></p>
        <button type="submit" class="btn btn-primary" style="margin-top:0.75rem;">Log in</button>
    </form>
</div>
{% endblock %}
