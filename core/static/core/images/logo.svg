<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <!-- Left Side: Clean Geometric Green House Icon -->
  <g transform="translate(10, 10)">
    <!-- Main House Outer Frame Lip -->
    <path d="M 50 15 L 90 48 L 90 85 L 63 85 L 63 60 L 37 60 L 37 85 L 10 85 L 10 48 Z" 
          fill="none" 
          stroke="#00ffb3" 
          stroke-width="7" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    <!-- Roof Overhang Accents -->
    <line x1="3" y1="52" x2="50" y2="13" stroke="#00ffb3" stroke-width="7" stroke-linecap="round" />
    <line x1="97" y1="52" x2="50" y2="13" stroke="#00ffb3" stroke-width="7" stroke-linecap="round" />
    <!-- Left Chimney Stack Feature -->
    <path d="M 24 35 L 24 20 L 34 20 L 34 43" fill="none" stroke="#00ffb3" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- Central Visual Divider Rail -->
  <line x1="130" y1="25" x2="130" y2="95" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="0.3" />

  <!-- Right Side: Clean Structured Typography Stack -->
  <!-- Main Platform Acronym (Inherits text color from parent container) -->
  <text x="155" y="60" 
        fill="currentColor" 
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif" 
        font-size="42px" 
        font-weight="800" 
        letter-spacing="1.5px">BHIMS</text>
        
  <!-- Institutional Branding Subtitle Row -->
  <text x="156" y="88" 
        fill="currentColor" 
        opacity="0.5" 
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif" 
        font-size="17px" 
        font-weight="700" 
        letter-spacing="3px">DMMMSU NLUC</text>
</svg>
